name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  component:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - core
          - claude
          - cursor
          - codex
          - copilot
          - cowork
          - grok
          - grok-bot
          - accounts
          - chat-history
          - git-posture
          - secrets-scan
          - pii-scan
          - cloud-agents
          - telemetry-import
          - integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test ${{ matrix.component }}
        shell: pwsh
        run: |
          .\scripts\test-component.ps1 -Name ${{ matrix.component }}

  # Python 3.14 ships compression.zstd. The real-decompression tests skip
  # when that module cannot be imported (the 3.11 job above).
  zstd-py314:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Assert stdlib zstd backend
        run: python -c "import compression.zstd"
      - name: Zstd component tests
        shell: pwsh
        run: |
          $failed = 0
          foreach ($component in @("core", "codex", "chat-history", "pii-scan", "secrets-scan", "integration")) {
            .\scripts\test-component.ps1 -Name $component
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
          }
          exit $failed

  mcp-visibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: MCP visibility tests
        run: python -m unittest discover -s tools/mcp-visibility/tests -v

  scrub-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sensitive-string scrub gate
        shell: pwsh
        run: |
          # Class-based checks: real user-profile paths, real Windows hostnames,
          # and live-looking secrets must never land in the repo. Placeholder
          # identities (you, me, Test User, ...) and the SCHEMA.md example
          # hostname are allowed. Documented AWS example keys are allowed only
          # as those exact strings.
          $files = Get-ChildItem -Recurse . -File | Where-Object {
            $_.Extension -in ".py",".ps1",".md",".html",".json",".txt",".yml",".toml" -and
            $_.FullName -notmatch "\\\.git(hub)?\\"
          }
          $patterns = @(
            # C:\Users\<real name> in any slash/escaping style, except placeholders
            'C:(\\|/)+Users(\\|/)+(?!(you|me|yourname|example|Test[ %]?User|Test)\b)[A-Za-z]'
            # Live token shapes that gitleaks-style fixtures should never use unmasked
            'AKIA[0-9A-Z]{16}'
            'ASIA[0-9A-Z]{16}'
            'xox[baprs]-[0-9]{8,}'
          )
          # Exact values from the AWS docs (IAM access key, STS temporary key).
          # A longer token that merely starts with one of these still fails.
          $awsExamples = @(
            'AKIAIOSFODNN7EXAMPLE'
            'ASIAIOSFODNN7EXAMPLE'
          )
          # Windows generates DESKTOP- plus 7 uppercase alphanumerics.
          # Case-sensitive, so the Grok Bot filename desktop-status.json does
          # not match. SCHEMA.md's DESKTOP-XYZ example is shorter than 7.
          $desktopPattern = 'DESKTOP-[A-Z0-9]{7}(?![A-Za-z0-9])'
          $sampleHost = 'DESKTOP-' + 'ABC1234'
          if ($sampleHost -cnotmatch $desktopPattern) {
            Write-Host "scrub gate no longer catches a realistic hostname"
            exit 1
          }
          if ('desktop-status.json' -cmatch $desktopPattern) {
            Write-Host "scrub gate matched desktop-status.json"
            exit 1
          }
          $hits = New-Object System.Collections.Generic.List[string]
          foreach ($hit in @($files | Select-String -Pattern $patterns -AllMatches)) {
            foreach ($match in @($hit.Matches)) {
              $value = [string]$match.Value
              if ($awsExamples -ccontains $value) {
                $escaped = [regex]::Escape($value)
                if ($hit.Line -cmatch "(?<![A-Z0-9])$escaped(?![A-Z0-9])") { continue }
              }
              $hits.Add("$($hit.Path):$($hit.LineNumber): $($hit.Line.Trim())")
            }
          }
          foreach ($hit in @($files | Select-String -Pattern $desktopPattern -CaseSensitive -AllMatches)) {
            $hits.Add("$($hit.Path):$($hit.LineNumber): $($hit.Line.Trim())")
          }
          if ($hits.Count -gt 0) { $hits | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host "scrub clean"
